<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintenance en cours — CoatiMundi</title>
    <meta name="description" content="The new site is coming soon. We are currently performing maintenance.">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" href="assets/coatimundi-logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* ============================================================
           RESET & BASE
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0A2B4E 0%, #1A56DB 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            overflow: hidden;
            position: relative;
            -webkit-font-smoothing: antialiased;
        }

        /* ============================================================
           FORMES DÉCORATIVES EN ARRIÈRE-PLAN
           ============================================================ */
        .bg-shape {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            pointer-events: none;
            z-index: 0;
        }

        .shape-1 {
            width: 500px;
            height: 500px;
            top: -200px;
            right: -150px;
            animation: float 8s ease-in-out infinite;
        }

        .shape-2 {
            width: 400px;
            height: 400px;
            bottom: -150px;
            left: -100px;
            animation: float 10s ease-in-out infinite reverse;
        }

        .shape-3 {
            width: 200px;
            height: 200px;
            top: 50%;
            left: 10%;
            background: rgba(14, 165, 233, 0.1);
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-30px) rotate(5deg); }
        }

        /* ============================================================
           CONTENEUR PRINCIPAL
           ============================================================ */
        .maintenance-container {
            position: relative;
            z-index: 1;
            max-width: 680px;
            width: 100%;
            text-align: center;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 32px;
            padding: 60px 48px;
            box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.4);
            animation: fadeInUp 0.8s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ============================================================
           LOGO
           ============================================================ */
        .logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 32px;
        }

        .logo img {
            height: 70px;
            width: auto;
            filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.3));
        }

        /* ============================================================
           ICÔNE DE MAINTENANCE
           ============================================================ */
        .maintenance-icon {
            width: 100px;
            height: 100px;
            margin: 0 auto 32px;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            animation: pulse 2.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.2); }
            50% { transform: scale(1.05); box-shadow: 0 0 0 20px rgba(255, 255, 255, 0); }
        }

        /* ============================================================
           TYPOGRAPHIE
           ============================================================ */
        .maintenance-container h1 {
            font-size: 42px;
            font-weight: 800;
            margin-bottom: 16px;
            line-height: 1.2;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #ffffff 0%, #DBEAFE 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .maintenance-container .subtitle {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: 40px;
            line-height: 1.6;
            max-width: 480px;
            margin-left: auto;
            margin-right: auto;
        }

        /* ============================================================
           BARRE DE PROGRESSION
           ============================================================ */
        .progress-section {
            margin-bottom: 40px;
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .progress-bar {
            width: 100%;
            height: 10px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 50px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            width: 75%;
            background: linear-gradient(90deg, #0EA5E9, #10B981);
            border-radius: 50px;
            position: relative;
            animation: shimmer 2s infinite;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.5);
        }

        .progress-fill::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.4),
                transparent
            );
            animation: shimmerMove 1.5s infinite;
        }

        @keyframes shimmerMove {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        /* ============================================================
           COMPTE À REBOURS
           ============================================================ */
        .countdown {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .countdown-item {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 16px 20px;
            min-width: 80px;
            transition: transform 0.2s;
        }

        .countdown-item:hover {
            transform: translateY(-4px);
            background: rgba(255, 255, 255, 0.15);
        }

        .countdown-number {
            font-size: 32px;
            font-weight: 800;
            line-height: 1;
            margin-bottom: 4px;
            color: #ffffff;
        }

        .countdown-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.6);
            font-weight: 600;
        }

        /* ============================================================
           BOUTONS
           ============================================================ */
        .buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 14px 28px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 15px;
            text-decoration: none;
            transition: all 0.2s ease;
            border: 2px solid transparent;
            cursor: pointer;
            font-family: inherit;
        }

        .btn-primary {
            background: #ffffff;
            color: #1A56DB;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
            background: #F0F4FF;
        }

        .btn-outline {
            background: transparent;
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.4);
        }

        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: #ffffff;
            transform: translateY(-2px);
        }

        /* ============================================================
           FOOTER
           ============================================================ */
        .footer-note {
            margin-top: 40px;
            padding-top: 24px;
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            font-size: 13px;
            color: rgba(255, 255, 255, 0.6);
            line-height: 1.6;
        }

        .footer-note a {
            color: rgba(255, 255, 255, 0.9);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }

        .footer-note a:hover {
            color: #ffffff;
            text-decoration: underline;
        }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 640px) {
            .maintenance-container {
                padding: 40px 24px;
                border-radius: 24px;
            }

            .maintenance-container h1 {
                font-size: 30px;
            }

            .maintenance-container .subtitle {
                font-size: 16px;
            }

            .maintenance-icon {
                width: 80px;
                height: 80px;
                font-size: 38px;
            }

            .logo img {
                height: 55px;
            }

            .countdown {
                gap: 10px;
            }

            .countdown-item {
                padding: 12px 14px;
                min-width: 65px;
            }

            .countdown-number {
                font-size: 24px;
            }

            .countdown-label {
                font-size: 10px;
            }

            .btn {
                padding: 12px 22px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

    <!-- Formes décoratives -->
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>
    <div class="bg-shape shape-3"></div>

    <!-- Conteneur principal -->
    <div class="maintenance-container">

        <!-- Logo -->
        <div class="logo">
            <img src="assets/coatimundi-logo.png" alt="CoatiMundi Logo">
        </div>

        <!-- Icône de maintenance -->
        <div class="maintenance-icon">
            🚧
        </div>

        <!-- Titre -->
        <h1>Maintenance en cours</h1>
        <p class="subtitle">
            The new CoatiMundi website is coming very soon. We are currently making some improvements to provide you with a better experience.
        </p>

        <!-- Barre de progression -->
        <div class="progress-section">
            <div class="progress-label">
                <span>Progression</span>
                <span>75%</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>
        </div>


        <!-- Boutons -->
        <div class="buttons">
            <a href="https://github.com/coatimundiapps" target="_blank" class="btn btn-primary">
                <span>🐙</span> Voir sur GitHub
            </a>

        </div>

        <!-- Footer note -->
        <div class="footer-note">
            <p>
                © 2026 CoatiMundi - David Tavares. Tous droits réservés.
            </p>
        </div>

    </div>

</body>
</html>
